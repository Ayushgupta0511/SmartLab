<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Announcements – SmartLab Admin</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    .announce-card {
      background:var(--white); border-radius:var(--radius-lg); padding:1.5rem 1.75rem;
      box-shadow:var(--shadow-sm); margin-bottom:1rem;
      border-top:3px solid var(--gold); transition:box-shadow var(--transition);
    }
    .announce-card:hover { box-shadow:var(--shadow-md); }
    .announce-card h3 { font-family:'Inter',sans-serif; font-size:1.05rem; font-weight:700; color:var(--navy); margin-bottom:0.5rem; }
    .announce-card p  { font-size:0.9rem; color:var(--text-mid); margin-bottom:0.75rem; }
    .announce-meta    { font-size:0.78rem; color:var(--text-muted); display:flex; gap:1rem; flex-wrap:wrap; }
    .char-count { font-size:0.78rem; color:var(--text-muted); text-align:right; margin-top:0.3rem; }
  </style>
</head>
<body>
<header class="topbar">
  <a href="../index.html" class="topbar-brand">
    <svg width="36" height="36" viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="12" fill="#C9A84C"/><rect x="4" y="4" width="36" height="36" rx="9" fill="#0D1B2A"/><ellipse cx="22" cy="22" rx="13" ry="6" stroke="#C9A84C" stroke-width="1.5" fill="none"/><ellipse cx="22" cy="22" rx="13" ry="6" stroke="#C9A84C" stroke-width="1.5" fill="none" transform="rotate(60 22 22)"/><ellipse cx="22" cy="22" rx="13" ry="6" stroke="#C9A84C" stroke-width="1.5" fill="none" transform="rotate(120 22 22)"/><circle cx="22" cy="22" r="3" fill="#C9A84C"/></svg>
    <div><span class="topbar-brand-name">SmartLab</span><span class="topbar-brand-sub">Administration</span></div>
  </a>
  <div class="topbar-actions">
    <span style="background:linear-gradient(135deg,var(--gold),var(--warning));color:var(--navy);padding:0.2rem 0.75rem;border-radius:50px;font-size:0.72rem;font-weight:700;">🛡️ Admin</span>
    <div class="user-chip"><div class="user-avatar" id="userAvatar">PS</div><span id="userName">Admin</span></div>
    <button class="btn btn-outline btn-sm" onclick="SmartLab.logout()">Sign Out</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section-label">Admin Panel</div>
    <a href="admin-dashboard.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="admin-workstations.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>Workstations</a>
    <a href="admin-faults.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>Fault Reports</a>
    <a href="admin-analytics.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Analytics</a>
    <a href="admin-audit.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>Audit Log</a>
    <div class="sidebar-section-label" style="margin-top:1rem;">Management</div>
    <a href="admin-announcements.html" class="sidebar-link active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Announcements</a>
    <a href="#" onclick="SmartLab.logout()" class="sidebar-link" style="color:#C0392B;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16,17 21,12 16,7"/></svg>Sign Out</a>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div class="breadcrumb"><a href="admin-dashboard.html">Admin</a> › Announcements</div>
      <h1>📢 Lab Announcements</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;">Post notices visible to all students on their dashboard.</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.5fr;gap:2rem;align-items:start;" class="announce-cols">
      <!-- Compose -->
      <div class="card">
        <div class="card-header"><h4>✏️ New Announcement</h4></div>
        <div class="card-body">
          <form id="announceForm" onsubmit="postAnnouncement(event)">
            <div class="form-group">
              <label class="form-label">Title</label>
              <input type="text" id="annTitle" class="form-control" placeholder="e.g. Lab hours extended this week" maxlength="80" required/>
              <div class="char-count"><span id="titleCount">0</span>/80</div>
            </div>
            <div class="form-group">
              <label class="form-label">Message</label>
              <textarea id="annBody" class="form-control" rows="5" placeholder="Write your announcement…" maxlength="500" required style="resize:vertical;"></textarea>
              <div class="char-count"><span id="bodyCount">0</span>/500</div>
            </div>
            <div class="form-group">
              <label class="form-label">Priority</label>
              <select id="annPriority" class="form-control">
                <option value="normal">📢 Normal</option>
                <option value="urgent">🚨 Urgent</option>
                <option value="info">ℹ️ Informational</option>
              </select>
            </div>
            <div id="announceAlert"></div>
            <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">Post Announcement</button>
          </form>
        </div>
      </div>

      <!-- Existing -->
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
          <h3 style="font-size:1rem;font-weight:700;color:var(--navy);">Active Announcements</h3>
          <span id="annCount" style="font-size:0.82rem;color:var(--text-muted);"></span>
        </div>
        <div id="announceList"></div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<script src="../js/app.js"></script>
<script>
  let user = null;
  window.onload = () => {
    user = SmartLab.requireAuth('admin');
    if (!user) return;
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.split(' ').filter((_,i)=>i<2).map(n=>n[0]).join('');
    renderAnnouncements();
    if (window.innerWidth < 768) document.querySelector('.announce-cols').style.gridTemplateColumns='1fr';

    // Char counters
    document.getElementById('annTitle').addEventListener('input', function(){ document.getElementById('titleCount').textContent=this.value.length; });
    document.getElementById('annBody').addEventListener('input', function(){ document.getElementById('bodyCount').textContent=this.value.length; });
  };

  function postAnnouncement(e) {
    e.preventDefault();
    const title = document.getElementById('annTitle').value.trim();
    const body  = document.getElementById('annBody').value.trim();
    const priority = document.getElementById('annPriority').value;

    const result = SmartLab.createAnnouncement(
      `${priority==='urgent'?'🚨 ':priority==='info'?'ℹ️ ':''}${title}`, body
    );
    if (result.success) {
      document.getElementById('announceForm').reset();
      document.getElementById('titleCount').textContent='0';
      document.getElementById('bodyCount').textContent='0';
      document.getElementById('announceAlert').innerHTML='';
      showToast('Announcement posted! 📢', 'success');
      renderAnnouncements();
    }
  }

  function renderAnnouncements() {
    const anns = SmartLab.state.announcements;
    document.getElementById('annCount').textContent = `${anns.length} posted`;
    document.getElementById('announceList').innerHTML = anns.map((a,i)=>`
      <div class="announce-card">
        <h3>${a.title}</h3>
        <p>${a.body}</p>
        <div class="announce-meta">
          <span>📅 ${a.date}</span>
          <span>✍️ ${a.author}</span>
        </div>
        <div style="margin-top:0.75rem;display:flex;gap:0.5rem;">
          <button class="btn btn-danger btn-sm" onclick="deleteAnn(${i})">Delete</button>
        </div>
      </div>`).join('') || '<p style="color:var(--text-muted);">No announcements posted yet.</p>';
  }

  function deleteAnn(idx) {
    if (!confirm('Delete this announcement?')) return;
    SmartLab.state.announcements.splice(idx, 1);
    SmartLab.addAuditLog(user.id,'ANNOUNCE_DELETE','Announcement deleted');
    showToast('Announcement deleted.', 'info');
    renderAnnouncements();
  }
</script>
</body>
</html>
