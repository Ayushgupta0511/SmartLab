<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workstation Management – SmartLab Admin</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    .ws-mgmt-card {
      background:var(--white); border-radius:var(--radius-lg); padding:1.25rem 1.5rem;
      box-shadow:var(--shadow-sm); margin-bottom:0.75rem;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
      border-left:4px solid var(--border); transition:box-shadow var(--transition);
    }
    .ws-mgmt-card:hover { box-shadow:var(--shadow-md); }
    .ws-mgmt-card.available  { border-left-color:#2ECC71; }
    .ws-mgmt-card.reserved   { border-left-color:#F39C12; }
    .ws-mgmt-card.checkedin  { border-left-color:#3498DB; }
    .ws-mgmt-card.outofsvc   { border-left-color:#E74C3C; }
    .ws-actions-row { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .search-bar { display:flex; gap:0.75rem; margin-bottom:1.5rem; }
    .qr-preview { background:var(--navy); border-radius:var(--radius); padding:1rem; display:flex; align-items:center; gap:1rem; color:var(--pearl); }
  </style>
</head>
<body>
<header class="topbar">
  <a href="../index.html" class="topbar-brand">
    <svg width="36" height="36" viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="12" fill="#C9A84C"/><rect x="4" y="4" width="36" height="36" rx="9" fill="#0D1B2A"/><ellipse cx="22" cy="22" rx="13" ry="6" stroke="#C9A84C" stroke-width="1.5" fill="none"/><ellipse cx="22" cy="22" rx="13" ry="6" stroke="#C9A84C" stroke-width="1.5" fill="none" transform="rotate(60 22 22)"/><ellipse cx="22" cy="22" rx="13" ry="6" stroke="#C9A84C" stroke-width="1.5" fill="none" transform="rotate(120 22 22)"/><circle cx="22" cy="22" r="3" fill="#C9A84C"/></svg>
    <div><span class="topbar-brand-name">SmartLab</span><span class="topbar-brand-sub">Administration</span></div>
  </a>
  <div class="topbar-actions">
    <span style="background:linear-gradient(135deg,var(--gold),var(--warning));color:var(--navy);padding:0.2rem 0.75rem;border-radius:50px;font-size:0.72rem;font-weight:700;">🛡️ Admin</span>
    <div class="user-chip"><div class="user-avatar" id="userAvatar">PS</div><span id="userName">Admin</span></div>
    <button class="btn btn-outline btn-sm" onclick="SmartLab.logout()">Sign Out</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section-label">Admin Panel</div>
    <a href="admin-dashboard.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="admin-workstations.html" class="sidebar-link active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Workstations</a>
    <a href="admin-faults.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>Fault Reports</a>
    <a href="admin-analytics.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Analytics</a>
    <a href="admin-audit.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>Audit Log</a>
    <div class="sidebar-section-label" style="margin-top:1rem;">Management</div>
    <a href="admin-announcements.html" class="sidebar-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>Announcements</a>
    <a href="#" onclick="SmartLab.logout()" class="sidebar-link" style="color:#C0392B;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/></svg>Sign Out</a>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div class="breadcrumb"><a href="admin-dashboard.html">Admin</a> › Workstations</div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
        <h1>🖥 Workstation Management</h1>
        <div style="display:flex;gap:0.75rem;">
          <span id="wsCount" style="font-size:0.9rem;color:var(--text-muted);align-self:center;"></span>
        </div>
      </div>
    </div>

    <!-- Search & filter -->
    <div class="search-bar">
      <input type="text" id="wsSearch" class="form-control" placeholder="Search by ID or status…" oninput="renderWsList()" style="max-width:300px;"/>
      <select id="wsFilter" class="form-control" style="max-width:200px;" onchange="renderWsList()">
        <option value="">All Statuses</option>
        <option value="available">Available</option>
        <option value="reserved">Reserved</option>
        <option value="checkedin">Checked In</option>
        <option value="outofsvc">Out of Service</option>
      </select>
    </div>

    <div id="wsList"></div>
  </main>
</div>

<!-- WS Detail Modal -->
<div class="modal-overlay" id="wsDetailModal">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <h3 id="wsDetailTitle">Workstation</h3>
      <button class="modal-close" onclick="closeModal('wsDetailModal')">✕</button>
    </div>
    <div id="wsDetailBody"></div>
    <div id="wsDetailActions" style="display:flex;gap:0.75rem;margin-top:1.5rem;flex-wrap:wrap;"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/app.js"></script>
<script>
  let user = null;
  window.onload = () => {
    user = SmartLab.requireAuth('admin');
    if (!user) return;
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.split(' ').filter((_,i)=>i<2).map(n=>n[0]).join('');
    renderWsList();
  };

  function renderWsList() {
    const search = document.getElementById('wsSearch').value.toLowerCase();
    const filter = document.getElementById('wsFilter').value;
    let ws = SmartLab.state.workstations;
    if (filter) ws = ws.filter(w=>w.status===filter);
    if (search) ws = ws.filter(w=>w.id.toLowerCase().includes(search)||w.status.toLowerCase().includes(search));

    document.getElementById('wsCount').textContent = `Showing ${ws.length} of ${SmartLab.state.workstations.length}`;
    const container = document.getElementById('wsList');
    container.innerHTML = ws.map(w=>`
      <div class="ws-mgmt-card ${w.status}">
        <div>
          <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.3rem;">
            <strong style="color:var(--navy);font-size:1rem;">${w.id}</strong>
            ${statusBadge(w.status)}
          </div>
          <div style="font-size:0.82rem;color:var(--text-muted);">Row ${w.row}, Col ${w.col} · QR: <code>${w.qrCode}</code></div>
        </div>
        <div class="ws-actions-row">
          <button class="btn btn-outline btn-sm" onclick="showWsDetail('${w.id}')">View Details</button>
          ${w.status!=='outofsvc'
            ? `<button class="btn btn-dark btn-sm" onclick="setOOS('${w.id}')">Mark OOS</button>`
            : `<button class="btn btn-success btn-sm" onclick="returnToService('${w.id}')">Return to Service</button>`}
        </div>
      </div>`).join('') || '<p style="color:var(--text-muted);">No workstations match the filter.</p>';
  }

  function showWsDetail(wsId) {
    const ws = SmartLab.getWorkstation(wsId);
    if (!ws) return;
    document.getElementById('wsDetailTitle').textContent = `🖥 ${ws.id}`;
    const checkIns = SmartLab.state.checkIns.filter(c=>c.wsId===wsId);
    const faults   = SmartLab.state.faultReports.filter(f=>f.wsId===wsId);
    document.getElementById('wsDetailBody').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;">
        <div><div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);font-weight:600;margin-bottom:0.3rem;">Status</div>${statusBadge(ws.status)}</div>
        <div><div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);font-weight:600;margin-bottom:0.3rem;">Location</div><div style="font-size:0.9rem;color:var(--text-mid);">Row ${ws.row}, Col ${ws.col}</div></div>
        <div><div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);font-weight:600;margin-bottom:0.3rem;">QR Code</div><code style="font-size:0.85rem;">${ws.qrCode}</code></div>
        <div><div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);font-weight:600;margin-bottom:0.3rem;">Total Faults</div><div style="font-size:0.9rem;color:var(--text-mid);">${faults.length}</div></div>
      </div>
      <div style="margin-bottom:1.25rem;">
        <h4 style="font-size:0.82rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:0.6rem;">Assets Bundle</h4>
        <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
          ${Object.entries(ws.assets).map(([k,v])=>`<span style="background:#F4F0E8;border-radius:50px;padding:0.25rem 0.65rem;font-size:0.78rem;color:var(--text-mid);font-weight:600;">💻 ${k}: ${v}</span>`).join('')}
        </div>
      </div>
      <div>
        <h4 style="font-size:0.82rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:0.6rem;">Recent Fault Reports</h4>
        ${faults.length ? faults.slice(0,3).map(f=>`
          <div style="padding:0.6rem;background:#F9F6EE;border-radius:var(--radius);margin-bottom:0.4rem;font-size:0.85rem;">
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.2rem;">${statusBadge(f.status)}<span style="color:var(--text-muted);">${formatDate(f.createdAt)}</span></div>
            <div style="color:var(--text-mid);">${f.description}</div>
          </div>`).join('')
          : '<p style="color:var(--text-muted);font-size:0.85rem;">No fault reports.</p>'}
      </div>`;

    const actions = document.getElementById('wsDetailActions');
    actions.innerHTML = '';
    if (ws.status !== 'outofsvc') {
      actions.innerHTML += `<button class="btn btn-dark" onclick="setOOS('${ws.id}');closeModal('wsDetailModal')">Mark Out of Service</button>`;
    } else {
      actions.innerHTML += `<button class="btn btn-success" onclick="returnToService('${ws.id}');closeModal('wsDetailModal')">Return to Service</button>`;
    }
    openModal('wsDetailModal');
  }

  function setOOS(wsId) {
    SmartLab.updateWsStatus(wsId, 'outofsvc');
    showToast(`${wsId} marked as out of service.`, 'info');
    renderWsList();
  }
  function returnToService(wsId) {
    SmartLab.updateWsStatus(wsId, 'available');
    showToast(`${wsId} returned to service. ✅`, 'success');
    renderWsList();
  }
</script>
</body>
</html>
